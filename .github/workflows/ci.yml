name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest import-linter
          pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Import-linter (contratos de capas)
        run: lint-imports

      - name: Perf scan (informational)
        run: python -m scripts.perf_scan
        continue-on-error: true

      - name: Observabilidad de jobs (informational)
        run: python -m scripts.audit_jobs_observabilidad
        continue-on-error: true

      # El inventario de endpoints y la matriz de permisos de docs/MAPA_APP.md
      # se generan desde la app montada. Si alguien agrega un router y no
      # regenera, el doc miente → esto lo frena. Bloqueante a propósito:
      # el arreglo es una línea (`python -m scripts.gen_mapa_app`).
      - name: Mapa de la app sincronizado
        run: python -m scripts.gen_mapa_app --check

      - name: Pytest
        run: pytest -ra
