# Golden set del flow estructurado de cartera.
#
# Cada caso define los params del CarteraRequest + criterios pass/fail
# booleanos sobre la respuesta. El script `scripts/eval_cartera.py` corre
# todos los casos contra POST /api/chat/structured/cartera y reporta
# pass/fail por caso.
#
# Sin assertions sobre los tickers concretos (varían según data del día).
# Solo sobre estructura: que el modelo respete el schema, que sume 100,
# que esté en el rango 3-5 instrumentos, que llame la tool, etc.

cases:
  - id: agresivo_pesos_largo_inflacion
    description: "Cartera agresiva en pesos largo plazo vs inflación"
    request:
      perfil: agresivo
      exposicion: pesos
      plazo: largo
      benchmark: inflacion
    expects:
      tool_called: responder_cartera
      cartera_min_items: 3
      cartera_max_items: 5
      pesos_suman_100: true
      tiene_tesis: true
      tiene_que_invalida: true

  - id: conservador_pesos_corto_inflacion
    description: "Conservador / pesos / corto plazo vs inflación"
    request:
      perfil: conservador
      exposicion: pesos
      plazo: corto
      benchmark: inflacion
    expects:
      tool_called: responder_cartera
      cartera_min_items: 3
      cartera_max_items: 5
      pesos_suman_100: true

  - id: moderado_mixta_medio_mep
    description: "Moderado mixta vs MEP"
    request:
      perfil: moderado
      exposicion: mixta
      plazo: medio
      benchmark: mep
    expects:
      tool_called: responder_cartera
      cartera_min_items: 3
      cartera_max_items: 5
      pesos_suman_100: true

  - id: agresivo_usd_largo_sin_benchmark
    description: "Agresivo dolarizado largo plazo sin benchmark"
    request:
      perfil: agresivo
      exposicion: usd
      plazo: largo
      benchmark: sin_benchmark
    expects:
      tool_called: responder_cartera
      cartera_min_items: 3
      cartera_max_items: 5
      pesos_suman_100: true

  - id: conservador_pesos_corto_caucion_con_restricciones
    description: "Conservador pesos corto vs caución con restricción 'sin HD'"
    request:
      perfil: conservador
      exposicion: pesos
      plazo: corto
      benchmark: tasa_caucion
      restricciones:
        - sin_HD
    expects:
      tool_called: responder_cartera
      cartera_min_items: 3
      cartera_max_items: 5
      pesos_suman_100: true
      # Si el modelo respeta la restricción, ningún ticker debería ser AL/AE/AO/GD/etc.
      # Ese check es más cualitativo, lo deja pasar el script con warning.
