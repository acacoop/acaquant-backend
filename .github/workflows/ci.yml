name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest import-linter
          pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Import-linter (contratos de capas)
        run: lint-imports

      - name: Perf scan (informational)
        run: python -m scripts.perf_scan
        continue-on-error: true

      - name: Observabilidad de jobs (informational)
        run: python -m scripts.audit_jobs_observabilidad
        continue-on-error: true

      # Pytest va ANTES del check del mapa a propósito: un doc desincronizado
      # no puede tapar el resultado de los tests. CI estuvo roja 30 pushes
      # seguidos (2026-08-21/22) y como cada paso bloqueante corta el job,
      # Pytest nunca corría — dos tests rotos y un contrato de capas entraron
      # sin que nadie los viera (`AGENT.md` §0.ci). El orden correcto es del
      # veredicto más informativo al más formal.
      - name: Pytest
        run: pytest -ra

      # El inventario de endpoints y la matriz de permisos de docs/MAPA_APP.md
      # se generan desde la app montada. Si alguien agrega un router y no
      # regenera, el doc miente → esto lo frena. Bloqueante a propósito:
      # el arreglo es una línea (`python -m scripts.gen_mapa_app`).
      # (2026-08-22: `superficie` cubre los dos mundos de FastAPI — con
      # envoltorios y plano — así que este check da lo mismo acá, en el
      # Droplet y en el sandbox. Ver `AGENT.md` §0.ci.)
      #
      # ⚠️ «DA LO MISMO EN TODOS LADOS» ES CIERTO **A IGUAL VERSIÓN DE FASTAPI**,
      # y esa parte faltaba. El conteo de «rutas con gate extra» sale de caminar
      # `route.dependant.dependencies`, y 0.141 mete ahí las `dependencies=` del
      # `include_router` que 0.136 —la que pinea `requirements.txt`— deja afuera.
      # Regenerar el doc desde un entorno con FastAPI sin pinear INFLA los
      # números (contaba el gate del módulo como si fuera un extra por ruta) y
      # deja este paso en rojo para siempre. **Regenerá con lo que pinea
      # `requirements.txt`**, que es lo que corre en el Droplet. AGENT.md §0.en.
      - name: Mapa de la app sincronizado
        run: python -m scripts.gen_mapa_app --check

      # docs/ACAQUANT.md es EL doc oficial. Sus tablas salen de systemd/crontab/
      # schema.sql y su primera línea lleva fecha + huella del contenido: si alguien
      # lo editó a mano sin regenerar, la huella no coincide y esto lo frena.
      # El arreglo es una línea (`python -m scripts.gen_sistema`).
      - name: Doc oficial sincronizado y estampado
        run: python -m scripts.gen_sistema --check
