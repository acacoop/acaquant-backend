[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["venv", "logs", ".ipynb_checkpoints", "Excel"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (imports / vars sin usar, typos)
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line-too-long (hay queries Mongo y pipelines largos)
    "E701",   # multiple statements on one line (estilo de algunos motores)
    "E702",   # idem
    "E741",   # ambiguous variable name (l, I)
    "B008",   # defaults complejos (común en Streamlit)
    "SIM102", # nested if: a veces más claro que un `and` largo
    "SIM105", # contextlib.suppress: try/except/pass es más explícito
    "SIM108", # if-else vs ternario: a veces el if-else es más legible
    "SIM117", # combinar with-statements
    "RUF001", # unicode ambiguo en strings (−, σ, →, × son matemáticos legítimos)
    "RUF002", # unicode ambiguo en docstrings
    "RUF003", # unicode ambiguo en comentarios
    "RUF005", # concat lista en lugar de spread: da igual
    "B905",   # zip sin strict=: usado en muchos sitios por compat
]

[tool.ruff.lint.per-file-ignores]
"scripts/*"          = ["T201"]   # prints OK en diagnóstico
"tests/**/*.py"      = ["S101", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requiere MongoDB o APIs externas (corre con -m integration)",
]
addopts = "-m 'not integration' -ra --strict-markers"
