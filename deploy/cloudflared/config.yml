# Cloudflare Tunnel — config del Droplet (valores-trading-server).
# Fuente de verdad versionada. En el Droplet vive en /etc/cloudflared/config.yml.
#
# Aplicar cambios:
#   cp deploy/cloudflared/config.yml /etc/cloudflared/config.yml
#   systemctl restart cloudflared
#
# El túnel hace HTTPS y esconde la IP del Droplet — no se exponen puertos.
tunnel: 1005045f-97ad-495c-aac3-dc859877b8bb
credentials-file: /root/.cloudflared/1005045f-97ad-495c-aac3-dc859877b8bb.json
ingress:
  # Streamlit interno de la mesa.
  - hostname: www.acaquant.com
    service: http://localhost:8501
  # partner_api — servicio externo de datos de portfolio. Auth JWT propia.
  # NO ponerle Cloudflare Access: el proveedor no tiene el SSO de la empresa.
  - hostname: data.acaquant.com
    service: http://localhost:8100
  # Catch-all: cualquier hostname no listado → 404.
  - service: http_status:404
