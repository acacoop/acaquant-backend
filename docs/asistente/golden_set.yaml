# Golden Set — Asistente de Mesa ACA Valores
#
# 55 test cases en 13 categorías. Fuente de verdad para evaluar regresiones
# del asistente. Schema y guía de contribución en golden_set_guia.md.
#
# Versión: v1 (2026-04-20)
# Principios: todas las rubrics usan benchmarks dinámicos (percentiles,
# z-score vs historia, clasificaciones relativas). NO se evalúan valores
# absolutos que cambien día a día.

meta:
  version: "v1"
  fecha_creacion: "2026-04-20"
  total_tests: 55
  categorias:
    lookup_con_interpretacion: 4
    gestion_cartera: 6
    licitacion_pre: 5
    licitacion_post: 3
    conexion_puntos: 4
    breakevens: 3
    forwards: 3
    riesgos: 4
    escenarios: 4
    estrategia: 6
    multi_turn: 3
    desambiguacion: 3
    scope: 3
    edge_case: 4


tests:

# ═══════════════════════════════════════════════════════════════════════════
# CATEGORÍA 1 — LOOKUP CON INTERPRETACIÓN
# Preguntas donde el dato por sí solo no alcanza. El asistente tiene que leer
# el número.
# ═══════════════════════════════════════════════════════════════════════════

- id: look-001
  category: lookup_con_interpretacion
  difficulty: medium
  query: "la TEA del CER más corto cómo está y qué implica"
  expected_tools:
    - name: obtener_curva_cer
    - name: clasificar_nivel
    - name: obtener_inflacion_reciente
  rubric: |
    PROCESO ESPERADO:
    1. Identificar el Boncer/Lecer más corto vigente.
    2. Traer su TEA actual.
    3. Clasificar esa TEA contra su historia reciente (60-90 días).
    4. Calcular breakeven implícito vs Lecap del mismo plazo.
    5. Contrastar con inflación mensual realizada reciente.

    CRITERIOS CONDICIONALES:
    - Si TEA real muy negativa y breakeven implícito < inflación
      realizada: explicar que hay premio por protección que se
      justifica si la inflación se mantiene.
    - Si TEA real poco negativa o positiva y breakeven > inflación
      realizada: el CER está relativamente barato, el mercado no
      demanda tanta protección.
    - Si TEA se movió significativamente vs su historia: mencionarlo
      como señal de cambio de expectativas.

    QUÉ EVALUAR:
    - Que no se limite a dar el número.
    - Que clasifique el nivel (caro/barato/normal).
    - Que conecte con breakeven e inflación.
    - Que concluya direccionalmente.

    QUÉ NO EVALUAR:
    - Valor específico de la TEA mencionada.
    - Qué ticker específico use como "CER más corto".
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: look-002
  category: lookup_con_interpretacion
  difficulty: medium
  query: "el canje CCL-MEP cómo está, es preocupante"
  expected_tools:
    - name: obtener_canje_actual
    - name: clasificar_nivel
    - name: obtener_canje_historia
  rubric: |
    PROCESO ESPERADO:
    1. Traer canje actual.
    2. Clasificar contra historia de 6-12 meses.
    3. Identificar tendencia reciente (últimos 30 días).

    CRITERIOS CONDICIONALES:
    - Canje en percentil alto (>75) o tendencia alcista reciente:
      señal de estrés en mercado de cable, dólares atrapados en aumento.
      Puede anticipar medidas regulatorias o ampliación de brecha.
    - Canje en percentil medio y estable: funcionamiento normal.
    - Canje en percentil bajo o comprimiendo: demanda relajada de cable,
      contexto benigno.

    QUÉ EVALUAR:
    - Que clasifique el nivel y la tendencia.
    - Que explique qué implica operativamente (compresión de rendimientos
      MEP vs cable, sweetener para suscripción en cable, etc.).
    - Que no afirme "es preocupante" sin justificación cuantitativa.
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: look-003
  category: lookup_con_interpretacion
  difficulty: hard
  query: "la curva de tasa fija está empinada o aplanada vs hace un mes"
  expected_tools:
    - name: obtener_curva_tasa_fija
    - name: obtener_curva_historica
    - name: calcular_pendiente_curva
  rubric: |
    PROCESO ESPERADO:
    1. Calcular pendiente actual (TEM largo - TEM corto) de la curva.
    2. Calcular pendiente 30 días atrás.
    3. Comparar la diferencia.
    4. Interpretar causa potencial.

    CRITERIOS CONDICIONALES:
    - Empinamiento (pendiente subió): mercado espera tasas más altas
      en el futuro, o prima de riesgo mayor en duration larga.
    - Aplanamiento (pendiente bajó): expectativa de tasas más bajas,
      o convergencia de expectativas.
    - Sin cambio significativo: estabilidad de expectativas.

    QUÉ EVALUAR:
    - Que cuantifique el cambio de pendiente en bps.
    - Que conecte con el régimen monetario vigente.
    - Que distinga empinamiento bearish (sube el largo) de bullish
      (baja el corto).
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: look-004
  category: lookup_con_interpretacion
  difficulty: medium
  query: "la paridad del Boncer más demandado cómo está, caro o barato"
  expected_tools:
    - name: obtener_curva_cer
    - name: obtener_volumen_por_ticker
    - name: clasificar_nivel
  rubric: |
    PROCESO ESPERADO:
    1. Identificar el Boncer con mayor volumen reciente.
    2. Traer paridad actual.
    3. Clasificar paridad contra historia.
    4. Contrastar con TEA real.

    CRITERIOS CONDICIONALES:
    - Paridad > 101 en tramo corto: demanda fuerte, TEA muy negativa,
      premio alto por protección.
    - Paridad ≈ 100: mercado neutral.
    - Paridad < 99 en tramo medio-largo: potencial value si la
      expectativa inflacionaria se sostiene.

    QUÉ EVALUAR:
    - Que distinga paridad de precio nominal.
    - Que vincule paridad con TEA real implícita.
    - Que dé contexto temporal (vencimiento, meses restantes).
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"


# ═══════════════════════════════════════════════════════════════════════════
# CATEGORÍA 2 — GESTIÓN DE CARTERA POR PERFIL
# Core del asistente. Adapta recomendación al perfil del cliente.
# ═══════════════════════════════════════════════════════════════════════════

- id: cart-001
  category: gestion_cartera
  difficulty: hard
  query: "cliente conservador horizonte 6 meses solo pesos, qué curva privilegia"
  expected_tools:
    - name: obtener_curva_tasa_fija
    - name: obtener_curva_cer
    - name: obtener_breakevens
    - name: obtener_inflacion_reciente
    - name: clasificar_nivel
  rubric: |
    PROCESO ESPERADO:
    1. Filtrar universo: Lecap y CER con vencimiento ≤ 6 meses.
    2. Identificar par Lecap-CER más cercano al horizonte.
    3. Calcular breakeven implícito.
    4. Traer inflación mensual realizada últimos 2-3 datos.
    5. Clasificar si el mercado pricea desinflación agresiva.

    CRITERIOS CONDICIONALES:
    - Breakeven < inflación realizada reciente: señal CER (mercado
      subestimando inflación).
    - Breakeven > inflación realizada: señal Lecap (mercado pricea
      desinflación que no llegó).
    - Breakeven ≈ inflación realizada: neutral, depende de view propia.

    QUÉ EVALUAR:
    - Que limite el universo al horizonte y moneda pedidos.
    - Que no recomiende Duales ni HD (fuera del mandato).
    - Que presente el trade-off: Lecap = certeza nominal, CER =
      protección real.
    - Que condicione la recomendación a la expectativa de inflación
      del usuario.

    QUÉ NO EVALUAR:
    - Tickers específicos mencionados.
    - Porcentajes exactos de asignación.
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: cart-002
  category: gestion_cartera
  difficulty: hard
  query: "cliente tolerancia media horizonte 18 meses 60/40 pesos/dólares dame la mezcla"
  expected_tools:
    - name: obtener_curva_tasa_fija
    - name: obtener_curva_cer
    - name: obtener_curva_hd
    - name: clasificar_nivel
    - name: obtener_canje_actual
  rubric: |
    PROCESO ESPERADO:
    Pata pesos (60%):
    1. Evaluar mix CER/Lecap medio en función del breakeven del tramo.
    2. Considerar Duales si TAMAR está en tendencia alcista (sino evitar).

    Pata dólares (40%):
    1. Identificar bono intra-mandato como ancla.
    2. Identificar Global/Bonar medio o largo como pata de upside.
    3. Considerar canje para la elección entre MEP y cable.

    CRITERIOS CONDICIONALES:
    - Si breakeven corto > realizada: sesgo Lecap en pesos.
      Si breakeven corto < realizada: sesgo CER.
    - Si TAMAR en mínimos/bajista: evitar Duales.
      Si TAMAR en máximos/alcista: Duales pueden sumar.
    - Si riesgo país en percentil alto con paquete financiero creíble:
      favor Global largo (convexidad).
      Si riesgo país ya comprimido: preferir carry corto intra-mandato.

    QUÉ EVALUAR:
    - Que respete la proporción 60/40.
    - Que diversifique dentro de cada pata.
    - Que justifique cada elección con la variable de mercado.
    - Que use lenguaje condicional ("en mi lectura", "sugiere").
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: cart-003
  category: gestion_cartera
  difficulty: hard
  query: "tengo un fondo 80% concentrado en un solo Boncer, aguanto o roto"
  expected_tools:
    - name: obtener_cotizacion
    - name: obtener_curva_cer
    - name: clasificar_nivel
    - name: calcular_forward_curva
  rubric: |
    PROCESO ESPERADO:
    1. Analizar el Boncer específico: paridad, TEA real, vencimiento.
    2. Clasificar su valuación vs curva CER (regresión/residuo).
    3. Calcular forwards contra Boncer adyacentes.
    4. Evaluar alternativas: mismo tramo con mejor valor, tramo más
       corto (menor riesgo duration), tramo más largo (más convexidad).

    CRITERIOS CONDICIONALES:
    - Si el Boncer está rico en la curva (residuo negativo significativo):
      recomendar rotación a Boncer del mismo tramo con mejor valor relativo.
    - Si está en línea con la curva pero la concentración es alta:
      recomendar diversificar por gestión de riesgo aunque la
      valuación sea razonable.
    - Si hay convicción inflacionaria alta y el bono está alineado:
      puede mantenerse pero sugerir sumar otro tramo para reducir
      duration o concentración.

    QUÉ EVALUAR:
    - Que reconozca el riesgo de concentración como factor propio.
    - Que dé 2-3 alternativas concretas de rotación.
    - Que cuantifique el pickup/pérdida de cada opción.
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: cart-004
  category: gestion_cartera
  difficulty: hard
  query: "perfil agresivo 12 meses solo dólares armame un barbell"
  expected_tools:
    - name: obtener_curva_hd
    - name: clasificar_nivel
    - name: obtener_riesgo_pais_historia
    - name: calcular_forward_curva
  rubric: |
    PROCESO ESPERADO:
    1. Identificar bono intra-mandato (pata corta).
    2. Identificar Global largo con duration y convexidad altas.
    3. Clasificar riesgo país actual vs historia.
    4. Calcular upside del largo en escenario de compresión.

    CRITERIOS CONDICIONALES:
    - Riesgo país en percentil alto: peso mayor a la pata larga
      (más upside por compresión).
    - Riesgo país en percentil bajo: peso mayor a la pata corta
      (menos margen de compresión, más riesgo duration).
    - Forward intra-mandato/post-mandato alta: más atractivo el tramo
      corto, esperar compresión del spread para entrar al largo.

    QUÉ EVALUAR:
    - Que justifique la elección de cada pata.
    - Que dé proporción (% corto / % largo) con justificación.
    - Que describa el comportamiento del barbell en escenario bueno
      y en escenario de stress.
    - Que mencione convexidad del tramo largo.
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: cart-005
  category: gestion_cartera
  difficulty: hard
  query: "el cliente quiere liquidez total dentro de 3 meses, tengo Boncer largo en cartera, qué hago"
  expected_tools:
    - name: obtener_cotizacion
    - name: obtener_liquidez_secundario
    - name: obtener_curva_cer
  rubric: |
    PROCESO ESPERADO:
    1. Identificar que la restricción es de horizonte, no de riesgo.
    2. Evaluar liquidez del Boncer actual (volumen secundario).
    3. Comparar costo de venta anticipada vs rotación a instrumento
       del horizonte pedido.
    4. Ofrecer 2-3 alternativas: vender y rotar a Lecap/CER corto,
       vender parcial y rotar parcial, mantener si la liquidez es buena
       y planificar salida gradual.

    CRITERIOS CONDICIONALES:
    - Boncer con buena liquidez: rotación limpia al tramo corto.
    - Boncer con mala liquidez: rotación gradual para evitar impacto
      de mercado.
    - Si el Boncer está sobrevendido (paridad baja vs curva): aconsejar
      esperar si hay flexibilidad.

    QUÉ EVALUAR:
    - Que priorice la restricción temporal del cliente.
    - Que no proponga instrumentos con vencimiento fuera del horizonte.
    - Que considere liquidez del instrumento actual como factor.
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: cart-006
  category: gestion_cartera
  difficulty: hard
  query: "hay un cliente que quiere tasa real positiva garantizada a 2 años"
  expected_tools:
    - name: obtener_curva_cer
    - name: clasificar_nivel
  rubric: |
    PROCESO ESPERADO:
    1. Filtrar Boncer con vencimiento ~24 meses.
    2. Identificar los que tienen TEA positiva (tasa real positiva al
       vencimiento asumiendo hold-to-maturity).
    3. Clasificar la TEA vs historia del tramo.

    CRITERIOS CONDICIONALES:
    - Si hay Boncer a 2 años con TEA real positiva: recomendar hold-to-
      maturity, aclarando que la volatilidad intermedia de precio
      puede ser significativa.
    - Si todos los Boncer a 2 años rinden negativo: advertir que "tasa
      real positiva garantizada" no es factible en ese plazo con CER,
      y ofrecer alternativas (más largo, o dólar linked con ajuste real
      implícito).

    QUÉ EVALUAR:
    - Que distinga TEA al vencimiento de TEA actual mark-to-market.
    - Que aclare el supuesto de hold-to-maturity.
    - Que ofrezca alternativas si la restricción no es factible.
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"


# ═══════════════════════════════════════════════════════════════════════════
# CATEGORÍA 3 — LICITACIONES (PRE Y POST)
# Core de uso frecuente. Tests separados por fase.
# ═══════════════════════════════════════════════════════════════════════════

- id: lici-001
  category: licitacion_pre
  difficulty: hard
  query: "hay lici el miércoles con CER largo y TAMAR qué pedir"
  expected_tools:
    - name: obtener_menu_licitacion
    - name: obtener_curva_cer
    - name: obtener_curva_tamar
    - name: calcular_forward_curva
    - name: clasificar_nivel
  rubric: |
    PROCESO ESPERADO:
    Para CER largo:
    1. Identificar tramo del nuevo bono.
    2. Calcular forward implícita vs Boncer previo.
    3. Comparar contra forward equivalente del secundario.

    Para TAMAR:
    1. Clasificar nivel actual de TAMAR (percentil histórico).
    2. Identificar tendencia (30 días).
    3. Calcular TAMAR breakeven implícita para distintos spreads posibles.
    4. Comparar contra Lecap/Boncap comparable.

    CRITERIOS CONDICIONALES:
    CER:
    - Forward nueva > secundario: pedir premio.
    - Forward nueva < secundario: recomendar ir al secundario.
    - Forward nueva ≈ secundario: tasa de corte del mercado.

    TAMAR:
    - TAMAR en mínimos o tendencia bajista: pedir spread ≥3pts o no
      participar.
    - TAMAR en rango medio estable: spread 1-3pts, alineado con última
      licitación.
    - TAMAR en máximos o tendencia alcista: spread <1pt puede ser
      aceptable si el carry futuro compensa.

    QUÉ EVALUAR:
    - Que analice cada instrumento por separado.
    - Que use forwards para el CER (no solo TEA nominal).
    - Que calcule TAMAR breakeven para la TAMAR.
    - Que dé tasa/spread sugeridos con justificación.
    - Coherencia entre clasificación de nivel y dirección.

    QUÉ NO EVALUAR:
    - Valor absoluto de forwards o TAMAR.
    - Tasa puntual sugerida (evaluar que esté en rango coherente).
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: lici-002
  category: licitacion_pre
  difficulty: hard
  query: "sale Lecap nueva a plazo similar a la que ya tenemos en cartera, conviene suscribir"
  expected_tools:
    - name: obtener_menu_licitacion
    - name: obtener_curva_tasa_fija
    - name: obtener_cotizacion
  rubric: |
    PROCESO ESPERADO:
    1. Identificar Lecap ofrecida en licitación (vencimiento, plazo).
    2. Identificar Lecap actual en cartera con vencimiento similar.
       NOTA: el asistente no accede a carteras. Debe responder en
       términos genéricos ("la Lecap comparable X del secundario").
    3. Calcular TEM/TEA esperada del corte basada en curva secundaria
       del tramo.
    4. Comparar con la Lecap actual.

    CRITERIOS CONDICIONALES:
    - Si se espera premio sobre secundario: suscribir y rotar.
    - Si se espera corte al secundario: neutro, no hay ventaja.
    - Si se espera castigo: mantener Lecap actual, no suscribir.

    QUÉ EVALUAR:
    - Que compare expectativa de corte vs mercado.
    - Que considere costo de rotación (spread bid-ask).
    - Que mencione liquidez (la Lecap nueva puede ser más líquida
      los primeros días por ser benchmark).
    - Que NO intente acceder a la cartera del cliente.
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: lici-003
  category: licitacion_pre
  difficulty: hard
  query: "hay Dólar Linked en la lici cuándo tiene sentido suscribir"
  expected_tools:
    - name: obtener_menu_licitacion
    - name: obtener_curva_dl
    - name: obtener_spot_historia
    - name: obtener_canje_actual
    - name: clasificar_nivel
  rubric: |
    PROCESO ESPERADO:
    1. Calcular breakeven cambiario del DL (depreciación implícita del
       spot que iguala DL con Lecap comparable).
    2. Comparar con Rofex implícito del mismo plazo.
    3. Clasificar spot actual (apreciación reciente, estable, depreciación).
    4. Calcular rendimiento en cable vs MEP considerando canje.

    CRITERIOS CONDICIONALES:
    - DL ofrece FX + spread alto y spot apreciándose: atractivo si se
      espera reversión o si el canje comprime.
    - DL ofrece FX + spread bajo: solo si hay convicción fuerte de
      depreciación.
    - Breakeven DL < Rofex implícito: DL caro vs futuros.
    - Breakeven DL > Rofex implícito: DL barato, arbitraje disponible.

    QUÉ EVALUAR:
    - Cálculo explícito del breakeven cambiario.
    - Comparación con alternativa (CER del mismo tramo).
    - Mención del canje como factor si el inversor opera cable.
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: lici-004
  category: licitacion_pre
  difficulty: hard
  query: "va a haber canje de bonos viejos por uno nuevo, cómo evalúo"
  expected_tools:
    - name: obtener_menu_licitacion
    - name: obtener_cotizacion
    - name: obtener_curva_cer
    - name: calcular_forward_curva
  rubric: |
    PROCESO ESPERADO:
    1. Identificar bonos elegibles para canje y bono destino.
    2. Calcular ratio de canje implícito a precios de mercado.
    3. Calcular forward implícita del bono destino vs bono actual.
    4. Comparar forward canje vs forward secundario.

    CRITERIOS CONDICIONALES:
    - Canje a precio de mercado con forward ≥ secundario: aceptar si
      se quiere estirar duration.
    - Canje con forward < secundario: rechazar, ir por secundario.
    - Si el bono actual está rindiendo negativo (caro): canje puede
      ser oportunidad para salir.
    - Si el bono actual está barato vs curva: no canjear.

    QUÉ EVALUAR:
    - Que evalúe bono origen y destino por separado.
    - Que use forward como métrica de estiramiento.
    - Que considere el valor relativo del bono actual vs curva.
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: lici-005
  category: licitacion_pre
  difficulty: hard
  query: "el tesoro ofrece bono en dólares en la lici, tiene sentido suscribir desde pesos"
  expected_tools:
    - name: obtener_menu_licitacion
    - name: obtener_curva_hd
    - name: obtener_canje_actual
    - name: obtener_spot_historia
  rubric: |
    PROCESO ESPERADO:
    1. Identificar bono HD ofrecido (intra-mandato o post-mandato).
    2. Calcular TNA esperada del corte.
    3. Si la suscripción es en pesos al spot oficial: evaluar conversión
       equivalente a cable vs MEP según canje.
    4. Evaluar si hay sweetener por canje amplio.

    CRITERIOS CONDICIONALES:
    - Canje amplio (inversor con cable): sweetener alto, suscripción
      muy atractiva.
    - Canje comprimido: sweetener menor, evaluar contra secundario.
    - Si el corte se espera con premio sobre secundario MEP y el
      cliente puede operar cable: atractivo.
    - Si el corte se espera al secundario y sin beneficios de cable:
      indiferente entre suscribir y comprar secundario.

    QUÉ EVALUAR:
    - Que distinga entre inversor con cable y sin cable.
    - Que mencione el sweetener del canje como factor.
    - Que calcule TNA equivalente en cable si aplica.
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: lici-006
  category: licitacion_post
  difficulty: medium
  query: "la Lecap nueva cortó a X TEM qué opinás"
  expected_tools:
    - name: obtener_resultado_licitacion
    - name: obtener_curva_tasa_fija
    - name: obtener_inflacion_reciente
  rubric: |
    PROCESO ESPERADO:
    1. Comparar tasa de corte vs expectativa previa (secundario).
    2. Clasificar: premio, alineada, castigo.
    3. Evaluar bid-to-cover como señal de demanda.
    4. Contrastar TEM con inflación realizada y expectativas.

    CRITERIOS CONDICIONALES:
    - Tasa menor al secundario con BTC alto: demanda fuerte, gobierno
      aprovechó para abaratar fondeo.
    - Tasa en línea con BTC ≈ 1: corte de mercado, mercado equilibrado.
    - Tasa con premio: gobierno necesitaba colocar, señal de que el
      secundario podría corregir al alza en los próximos días.

    QUÉ EVALUAR:
    - Que compare vs secundario del día previo.
    - Que interprete el BTC.
    - Que anticipe efecto sobre curva secundaria.
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: lici-007
  category: licitacion_post
  difficulty: hard
  query: "no lograron completar el libro del bono HD largo, qué implica"
  expected_tools:
    - name: obtener_resultado_licitacion
    - name: obtener_curva_hd
    - name: clasificar_nivel
  rubric: |
    PROCESO ESPERADO:
    1. Identificar qué bono no se completó y qué porcentaje quedó afuera.
    2. Evaluar la tasa de corte vs expectativa.
    3. Clasificar demanda por tramo (corto vs largo en HD).

    CRITERIOS CONDICIONALES:
    - Bono post-mandato con poca demanda: señal de riesgo político
      latente, spread intra-mandato/post-mandato podría ampliarse.
    - Bono intra-mandato sobredemandado y post-mandato deslucido:
      mercado diferenciando claramente horizontes.

    QUÉ EVALUAR:
    - Que interprete la demanda fallida como señal, no solo dato.
    - Que mencione el spread intra/post mandato como canal.
    - Que sugiera implicancia para posicionamiento (si comprime spread
      hay oportunidad en el bono largo).
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: lici-008
  category: licitacion_post
  difficulty: hard
  query: "rolleo 127% cuánto afecta la liquidez del sistema"
  expected_tools:
    - name: obtener_resultado_licitacion
    - name: obtener_repo_stock
  rubric: |
    PROCESO ESPERADO:
    1. Calcular retiro neto de liquidez (monto colocado - vencimientos).
    2. Comparar con stock de REPO actual para dimensionar impacto
       relativo.
    3. Evaluar si las tenencias del BCRA en el menú reducen el impacto
       real.

    CRITERIOS CONDICIONALES:
    - Retiro neto grande vs REPO pequeño: impacto significativo,
      tasas overnight pueden subir temporalmente.
    - Retiro neto pequeño vs REPO abundante: impacto marginal, tasas
      estables.
    - Si hubo canje con BCRA: el retiro real al sistema privado es
      menor al nominal.

    QUÉ EVALUAR:
    - Cuantificación del impacto relativo (% del REPO).
    - Distinción entre impacto nominal y efectivo al sistema privado.
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"


# ═══════════════════════════════════════════════════════════════════════════
# CATEGORÍA 4 — CONEXIÓN DE PUNTOS
# Cruzar variables que parecen no relacionadas.
# ═══════════════════════════════════════════════════════════════════════════

- id: conn-001
  category: conexion_puntos
  difficulty: hard
  query: "el canje se amplía y la TAMAR cae, cómo se conecta con mi Dual"
  expected_tools:
    - name: obtener_canje_actual
    - name: obtener_tamar_actual
    - name: clasificar_nivel
    - name: obtener_repo_stock
  rubric: |
    PROCESO ESPERADO:
    1. Clasificar nivel y tendencia de canje.
    2. Clasificar nivel y tendencia de TAMAR.
    3. Identificar causalidad: canje amplio implica más compras BCRA
       implica más pesos inyectados implica más liquidez implica
       presión bajista en TAMAR.

    CRITERIOS CONDICIONALES:
    - Canje alto + TAMAR bajista: dinámica auto-reforzada, Dual
      desfavorecido porque cupones futuros bajan.
    - Canje alto pero TAMAR estable: puede haber absorción vía
      licitaciones o encajes.
    - Canje bajo + TAMAR subiendo: Dual comienza a ser atractivo.

    QUÉ EVALUAR:
    - Que explique la cadena causal.
    - Que conecte con cupón efectivo del Dual.
    - Que recomiende rotación si el escenario es adverso.
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: conn-002
  category: conexion_puntos
  difficulty: hard
  query: "si el paquete de garantías multilaterales se cae qué pasa con mi HD largo"
  expected_tools:
    - name: obtener_curva_hd
    - name: obtener_riesgo_pais_historia
    - name: clasificar_nivel
  rubric: |
    PROCESO ESPERADO:
    1. Identificar el estado actual del riesgo país.
    2. Estimar sensibilidad del HD largo a un ensanchamiento del spread.
    3. Cuantificar pérdida potencial por duration y convexidad.

    CRITERIOS CONDICIONALES:
    - Riesgo país ya comprimido por noticias financiamiento:
      vulnerabilidad alta ante reversión.
    - Riesgo país alto: menos downside adicional por mala noticia.

    QUÉ EVALUAR:
    - Cuantificación aproximada del impacto (duration × cambio spread).
    - Mención de convexidad.
    - Sugerencia de hedge posible (short futuros, rotar a corto).
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: conn-003
  category: conexion_puntos
  difficulty: hard
  query: "la mora sube pero las tasas están bajas, eso qué significa para el HD largo"
  expected_tools:
    - name: obtener_curva_hd
    - name: calcular_forward_curva
    - name: obtener_riesgo_pais_historia
  rubric: |
    PROCESO ESPERADO:
    NOTA: la premisa "la mora sube" la pone el usuario. El asistente
    la acepta como dato input y analiza la consecuencia. NO intenta
    verificarla con data que no tiene.

    1. Identificar la divergencia: mercado financiero optimista
       (tasas bajas, spreads comprimidos), economía real deteriorada.
    2. Calcular forward intra-mandato/post-mandato como proxy de
       riesgo político.
    3. Evaluar si esa forward comprimió pese a la divergencia.

    CRITERIOS CONDICIONALES:
    - Forward comprimida con divergencia grande: HD largo vulnerable
      a reprice si la divergencia se resuelve negativamente.
    - Forward amplia: riesgo ya parcialmente priceado.

    QUÉ EVALUAR:
    - Reconocimiento de la divergencia como asimetría.
    - Uso del spread intra/post como proxy.
    - Mención del riesgo político como factor latente.
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: conn-004
  category: conexion_puntos
  difficulty: hard
  query: "el mayorista dio alto pero bajo en el mes anterior, cómo leo para CER largo"
  expected_tools:
    - name: obtener_inflacion_reciente
    - name: obtener_inflacion_mayorista
    - name: obtener_curva_cer
  rubric: |
    PROCESO ESPERADO:
    1. Identificar volatilidad del mayorista en los últimos meses.
    2. Evaluar si los shocks son transitorios (identificables como
       externos) o estructurales.
    3. Relacionar con breakeven del CER largo.

    CRITERIOS CONDICIONALES:
    - Volatilidad por shocks transitorios: el CER largo captura
      inflación promedio, ruido mensual no afecta tanto.
    - Volatilidad estructural: riesgo de que la inflación promedio
      sea mayor a la priceada.

    QUÉ EVALUAR:
    - Distinción entre tendencia y ruido.
    - Foco en inflación promedio del período del CER.
    - Uso del breakeven de largo plazo como ancla.
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"


# ═══════════════════════════════════════════════════════════════════════════
# CATEGORÍA 5 — BREAKEVENS COMO EXPECTATIVA FUTURA
# ═══════════════════════════════════════════════════════════════════════════

- id: be-001
  category: breakevens
  difficulty: hard
  query: "el breakeven del par a 4 meses está en X qué implica"
  expected_tools:
    - name: obtener_breakevens
    - name: obtener_inflacion_reciente
    - name: obtener_rem
  rubric: |
    PROCESO ESPERADO:
    1. Aclarar que el breakeven es inflación mensual PROMEDIO implícita.
    2. Contrastar con inflación mensual realizada reciente.
    3. Contrastar con expectativa REM.
    4. Sugerir evaluar sendero, no solo promedio.

    CRITERIOS CONDICIONALES:
    - Breakeven < realizada: Lecap cara si la inflación se sostiene.
    - Breakeven > realizada: Lecap con colchón si la desinflación llega.
    - Breakeven ≈ REM: mercado y consultoras alineados, sin arbitraje
      claro.

    QUÉ EVALUAR:
    - Aclaración conceptual (promedio, no realización).
    - Triple comparación: realizada, REM, propia.
    - Mención del sendero (no solo el nivel).
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: be-002
  category: breakevens
  difficulty: hard
  query: "la curva de breakevens tiene pendiente negativa qué implica"
  expected_tools:
    - name: obtener_breakevens
    - name: obtener_inflacion_reciente
  rubric: |
    PROCESO ESPERADO:
    1. Identificar breakeven corto y largo.
    2. Cuantificar la pendiente.
    3. Interpretar: el mercado pricea desinflación.

    CRITERIOS CONDICIONALES:
    - Pendiente negativa fuerte: mercado espera desinflación agresiva.
      Si uno no cree en esa velocidad, CER medio-largo tiene upside.
    - Pendiente levemente negativa: desinflación gradual priceada.
    - Pendiente plana: inflación estable esperada.
    - Pendiente positiva: inflación creciente (inusual).

    QUÉ EVALUAR:
    - Cuantificación de la pendiente.
    - Cuestionamiento del escenario implícito.
    - Implicancia direccional para CER medio-largo.
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: be-003
  category: breakevens
  difficulty: hard
  query: "sale el dato de inflación mañana, cómo se recalibran los breakevens si sorprende al alza"
  expected_tools:
    - name: obtener_breakevens
    - name: obtener_inflacion_reciente
    - name: obtener_curva_tasa_fija
    - name: obtener_curva_cer
  rubric: |
    PROCESO ESPERADO:
    Razonar el efecto mecánico:
    1. Mercado ajusta al alza expectativas futuras.
    2. Lecap cortas: TEM sube (precio baja) porque quedan caras.
    3. Boncer cortos: TEA menos negativa (precio sube) porque aumentan
       demanda.
    4. Breakevens se desplazan hacia arriba especialmente en el tramo
       corto-medio.

    CRITERIOS CONDICIONALES:
    - Sorpresa fuerte al alza: efecto grande en tramo corto (alta
      convexidad al cambio de expectativas).
    - Sorpresa al alza moderada: efecto en toda la curva, mayor en
      el tramo corto.
    - Dato en línea con expectativa: efecto nulo.

    QUÉ EVALUAR:
    - Razonamiento de efectos mecánicos.
    - Diferenciación por tramo.
    - Recomendación direccional (posicionarse en CER corto antes del
      dato si se espera sorpresa al alza).
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"


# ═══════════════════════════════════════════════════════════════════════════
# CATEGORÍA 6 — FORWARDS
# ═══════════════════════════════════════════════════════════════════════════

- id: fwd-001
  category: forwards
  difficulty: hard
  query: "la forward entre dos bonares cómo interpreto"
  expected_tools:
    - name: calcular_forward_curva
    - name: obtener_curva_hd
    - name: clasificar_nivel
  rubric: |
    PROCESO ESPERADO:
    1. Identificar el tramo implícito (generalmente post-cambio de
       mandato).
    2. Clasificar el nivel de la forward vs historia propia.
    3. Comparar con TEA del bono intra-mandato y con pares EM.
       NOTA: si no hay data de pares EM disponible, el modelo debería
       limitarse a "vs historia propia" sin inventar comparaciones.

    CRITERIOS CONDICIONALES:
    - Forward muy alta vs historia: prima de riesgo político elevada.
    - Forward en descenso: mercado descuenta continuidad.
    - Forward similar a pares EM con rating B-: el mercado ya priceó
      convergencia de calidad crediticia.

    QUÉ EVALUAR:
    - Clasificación contra historia.
    - Uso como proxy de riesgo político.
    - Comparación con benchmark internacional (si data disponible).
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: fwd-002
  category: forwards
  difficulty: hard
  query: "la forward CER entre dos Boncer qué me dice"
  expected_tools:
    - name: calcular_forward_curva
    - name: obtener_curva_cer
    - name: clasificar_nivel
  rubric: |
    PROCESO ESPERADO:
    1. Calcular forward TEA entre los dos Boncer.
    2. Comparar con TEA del tramo previo.
    3. Identificar si hay quiebre de expectativas.

    CRITERIOS CONDICIONALES:
    - Forward CER alta vs tramo previo: quiebre (el mercado espera
      régimen distinto en ese punto, o hay prima por demanda baja).
    - Forward CER en línea: curva continua, sin quiebre.

    QUÉ EVALUAR:
    - Cálculo explícito de la forward.
    - Identificación de quiebres.
    - Posible interpretación (cambio de régimen esperado, prima de
      liquidez).
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: fwd-003
  category: forwards
  difficulty: hard
  query: "cuánto compensa estirar en la curva tasa fija del corto al medio"
  expected_tools:
    - name: calcular_forward_curva
    - name: obtener_curva_tasa_fija
    - name: clasificar_nivel
  rubric: |
    PROCESO ESPERADO:
    1. Calcular forward entre Lecap corta y media.
    2. Comparar con TEM corta.
    3. Evaluar pickup en bps.
    4. Clasificar volatilidad histórica de tasas cortas para dimensionar
       riesgo.

    CRITERIOS CONDICIONALES:
    - Forward > TEM corta por margen mayor a volatilidad típica: estirar
      es rentable aunque las tasas suban moderadamente.
    - Forward ≈ TEM corta: no compensa el riesgo duration.
    - Forward < TEM corta (curva invertida): mercado espera tasas más
      bajas, acortarse paga.

    QUÉ EVALUAR:
    - Pickup cuantificado.
    - Comparación con volatilidad de tasas.
    - Recomendación direccional con condicionantes.
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"


# ═══════════════════════════════════════════════════════════════════════════
# CATEGORÍA 7 — RIESGOS Y ASIMETRÍAS
# ═══════════════════════════════════════════════════════════════════════════

- id: risk-001
  category: riesgos
  difficulty: hard
  query: "estoy en Lecap corta qué tiene que pasar para que pierda"
  expected_tools:
    - name: obtener_breakevens
    - name: obtener_inflacion_reciente
    - name: obtener_curva_tasa_fija
  rubric: |
    PROCESO ESPERADO:
    1. Identificar el par Lecap-CER del plazo del usuario.
    2. Extraer breakeven implícito.
    3. Razonar escenarios de inflación > breakeven.
    4. Identificar catalizadores.

    CRITERIOS CONDICIONALES:
    - Breakeven bajo vs realizada: probabilidad alta de perder contra
      CER, asimetría desfavorable.
    - Breakeven alto vs realizada: colchón grande, asimetría favorable.

    QUÉ EVALUAR:
    - Inversión correcta del razonamiento (identificar el escenario
      de pérdida, no el de ganancia).
    - Catalizadores concretos (shock oferta, tarifas, cambiario).
    - Evaluación de asimetría (upside vs downside).
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: risk-002
  category: riesgos
  difficulty: hard
  query: "cuánto puedo perder en un mes en un Global largo si el riesgo país sube significativamente"
  expected_tools:
    - name: obtener_curva_hd
    - name: calcular_duration_convexidad
  rubric: |
    PROCESO ESPERADO:
    1. Identificar el Global largo más referenciado.
    2. Obtener duration modificada y convexidad.
    3. Aplicar formula price/duration para distintos ensanchamientos.
    4. Sumar cupón devengado del mes.

    CRITERIOS CONDICIONALES:
    - Bono con alta convexidad: el impacto negativo es amortiguado
      parcialmente (convexidad positiva ayuda ante movimientos grandes).
    - Bono con baja convexidad: impacto más lineal con duration.

    QUÉ EVALUAR:
    - Cálculo numérico con duration y convexidad.
    - Consideración del cupón.
    - Identificación de catalizadores del ensanchamiento.
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: risk-003
  category: riesgos
  difficulty: hard
  query: "diferencia de riesgo entre Bonar y Global del mismo tramo"
  expected_tools:
    - name: obtener_curva_hd
    - name: clasificar_nivel
  rubric: |
    PROCESO ESPERADO:
    1. Identificar spread ley (Global ley NY vs Bonar ley local).
       NOTA: el modelo distingue Bonar/Global por el campo `tipo` en
       Trading.Curvas (`bonares` = local, `globales` = NY).
    2. Clasificar ese spread vs historia.
    3. Explicar fundamentos: protección legal en reestructuración.

    CRITERIOS CONDICIONALES:
    - Spread ley amplio: Global paga premio significativo por protección.
    - Spread ley comprimido: mercado percibe menos riesgo legal.

    QUÉ EVALUAR:
    - Identificación del spread ley como factor.
    - Explicación clara de la asimetría legal.
    - Mención de que Bonar captura más upside en escenarios benignos,
      Global protege más en escenarios de stress.
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: risk-004
  category: riesgos
  difficulty: hard
  query: "tengo Dólar Linked qué me puede matar"
  expected_tools:
    - name: obtener_spot_historia
    - name: obtener_canje_actual
    - name: obtener_curva_dl
  rubric: |
    PROCESO ESPERADO:
    Identificar tres riesgos:
    1. Apreciación del oficial.
    2. Compresión del canje si el inversor pagó en cable.
    3. Inflación más rápida que el FX.

    CRITERIOS CONDICIONALES:
    - Spot apreciándose + canje ampliándose: escenario doble negativo
      si se compró contra cable.
    - Inflación acelerando pero spot estable: el DL pierde contra CER.

    QUÉ EVALUAR:
    - Cobertura de los tres riesgos.
    - Cuantificación con ejemplos.
    - Mención del escenario actual relevante.
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"


# ═══════════════════════════════════════════════════════════════════════════
# CATEGORÍA 8 — ESCENARIOS Y SENSIBILIDAD
# ═══════════════════════════════════════════════════════════════════════════

- id: esc-001
  category: escenarios
  difficulty: hard
  query: "cómo quedo si la inflación promedia X los próximos meses vs Y"
  expected_tools:
    - name: obtener_breakevens
    - name: obtener_curva_cer
    - name: obtener_curva_tasa_fija
  rubric: |
    PROCESO ESPERADO:
    1. Calcular retorno Lecap (fijo).
    2. Calcular retorno CER bajo cada escenario de inflación.
    3. Calcular diferencia CER - Lecap en cada escenario.
    4. Identificar breakeven de inflación (punto de empate).

    QUÉ EVALUAR:
    - Tabla o comparación clara por escenario.
    - Identificación del breakeven numérico.
    - Recomendación condicional.
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: esc-002
  category: escenarios
  difficulty: hard
  query: "si el riesgo país baja significativamente, cuánto gana el HD largo vs el corto"
  expected_tools:
    - name: obtener_curva_hd
    - name: calcular_duration_convexidad
  rubric: |
    PROCESO ESPERADO:
    1. Aplicar duration y convexidad de cada bono al escenario.
    2. Cuantificar ganancia corta y ganancia larga.
    3. Calcular ratio de pickup.

    CRITERIOS CONDICIONALES:
    - Ratio largo/corto >3x: convicción fuerte justifica largo.
    - Ratio <2x: riesgo duration no compensa tanto.

    QUÉ EVALUAR:
    - Cálculo con duration y convexidad.
    - Ratio de pickup relativo.
    - Trade-off con escenario negativo.
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: esc-003
  category: escenarios
  difficulty: hard
  query: "si la TAMAR se frena y queda estable, cómo impacta mi Dual"
  expected_tools:
    - name: obtener_tamar_actual
    - name: obtener_curva_tamar
    - name: obtener_curva_tasa_fija
  rubric: |
    PROCESO ESPERADO:
    NOTA: Asumí regla del Dual TAMAR: cupón = max(TAMAR+spread, tasa_fija).
    El modelo razona con esta regla aunque no esté explícita en el
    schema de Trading.Curvas hoy.

    1. Proyectar cupón efectivo del Dual asumiendo TAMAR constante.
    2. Comparar rendimiento total vs Lecap/Boncap comparable.
    3. Evaluar si el optionality del Dual (max entre TAMAR y tasa fija)
       se activa en el escenario.

    CRITERIOS CONDICIONALES:
    - Lecap comparable rinde más: Dual está caro, rotar.
    - Lecap comparable rinde menos: el spread del Dual justifica.
    - Optionality activo: Dual tiene valor adicional.

    QUÉ EVALUAR:
    - Cálculo del cupón proyectado.
    - Comparación explícita con alternativa.
    - Mención del optionality.
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: esc-004
  category: escenarios
  difficulty: hard
  query: "si el canje comprime fuerte, qué gana y qué pierde en mi cartera"
  expected_tools:
    - name: obtener_canje_actual
    - name: obtener_curva_hd
    - name: obtener_curva_dl
  rubric: |
    PROCESO ESPERADO:
    Identificar efectos por tipo de activo (no acceder a cartera real
    del cliente — responder genérico):
    1. Bonares contra MEP: sus rendimientos contra MEP suben (sube la
       TNA expresada contra MEP) porque el MEP se aprecia vs cable.
    2. Bonares contra cable: el sweetener desaparece, pierden atractivo
       relativo.
    3. Globales: menos afectados directamente, pero el spread MEP-cable
       se normaliza.
    4. DL comprado contra cable: ganancia por compresión de brecha.
    5. CER: marginalmente beneficiado por menor distorsión.

    QUÉ EVALUAR:
    - Cobertura de múltiples clases de activos.
    - Dirección correcta en cada caso.
    - Cuantificación aproximada del efecto.
    - NO acceder a datos específicos de la cartera del cliente.
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"


# ═══════════════════════════════════════════════════════════════════════════
# CATEGORÍA 9 — ESTRATEGIAS ESTRUCTURADAS
# ═══════════════════════════════════════════════════════════════════════════

- id: estr-001
  category: estrategia
  difficulty: hard
  query: "armame un carry en Lecaps con horizonte 2 meses"
  expected_tools:
    - name: obtener_curva_tasa_fija
    - name: clasificar_nivel
    - name: obtener_repo_stock
  rubric: |
    PROCESO ESPERADO:
    1. Filtrar Lecaps con vencimiento ~60 días.
    2. Calcular TEM (carry) y roll-down esperado.
    3. Rankear por retorno total esperado.
    4. Elegir la de mejor asimetría.

    CRITERIOS CONDICIONALES:
    - Curva empinada en ese tramo: roll-down significativo, priorizar.
    - Curva plana: solo carry cuenta, elegir la de mayor TEM.

    QUÉ EVALUAR:
    - Identificación de Lecap específica con justificación.
    - Cálculo de TEM + roll-down.
    - Ejemplo numérico (inversión, retorno esperado).
    - Mención de riesgos (reinversión, sorpresa inflacionaria).
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: estr-002
  category: estrategia
  difficulty: hard
  query: "armame un butterfly en la curva CER"
  expected_tools:
    - name: obtener_curva_cer
    - name: calcular_butterfly_spread
    - name: clasificar_nivel
  rubric: |
    PROCESO ESPERADO:
    1. Elegir tres puntos de la curva (ala corta, cuerpo, ala larga).
    2. Calcular pesos dollar-duration neutrales.
    3. Calcular butterfly spread actual.
    4. Clasificar contra historia (Z-score).

    CRITERIOS CONDICIONALES:
    - BF spread en Z>+2 (cuerpo barato): comprar cuerpo, vender alas.
    - BF spread en Z<-2 (cuerpo caro): vender cuerpo, comprar alas.
    - BF spread cerca de media: no hay trade claro.

    QUÉ EVALUAR:
    - Cálculo correcto de pesos (P1+P3=P2, P1·D1+P3·D3=P2·D2).
    - Uso de Z-score como señal.
    - Recomendación direccional explícita.
    - Mención de riesgos (curva se mueve en paralelo, no es perfecta).
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: estr-003
  category: estrategia
  difficulty: hard
  query: "cómo capturo el spread entre Bonar y Global del mismo tramo"
  expected_tools:
    - name: obtener_curva_hd
    - name: clasificar_nivel
  rubric: |
    PROCESO ESPERADO:
    1. Identificar pares Bonar-Global de duration similar.
    2. Calcular spread ley actual.
    3. Clasificar contra historia.

    CRITERIOS CONDICIONALES:
    - Spread amplio vs historia: comprar Bonar (spread más rentable).
    - Spread comprimido: comprar Global (protección legal barata).

    QUÉ EVALUAR:
    - Identificación del par.
    - Cuantificación del spread.
    - Clasificación histórica.
    - Trade-off legal vs carry.
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: estr-004
  category: estrategia
  difficulty: hard
  query: "armame ladder en CER para horizonte 18 meses"
  expected_tools:
    - name: obtener_curva_cer
  rubric: |
    PROCESO ESPERADO:
    1. Identificar Boncer escalonados: ~3m, ~6m, ~9m, ~12m, ~18m.
    2. Asignar pesos iguales o con sesgo según view propia.
    3. Calcular duration promedio del portafolio.

    CRITERIOS CONDICIONALES:
    - Inflación esperada alta en el corto: sesgo al tramo corto-medio.
    - Inflación esperada decreciente: sesgo al largo (tasas reales
      positivas).

    QUÉ EVALUAR:
    - Escalonamiento real (no concentración).
    - Duration promedio razonable vs horizonte.
    - Diversificación de reinversión.
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: estr-005
  category: estrategia
  difficulty: hard
  query: "hay una inconsistencia entre Rofex y breakeven DL-Lecap, cómo opero"
  expected_tools:
    - name: obtener_curva_dl
    - name: obtener_rofex
    - name: obtener_curva_tasa_fija
  rubric: |
    PROCESO ESPERADO:
    1. Calcular depreciación implícita en el par DL-Lecap.
    2. Obtener Rofex del mismo plazo.
    3. Identificar divergencia.

    CRITERIOS CONDICIONALES:
    - Breakeven DL > Rofex: DL priceando más devaluación que futuros.
      Arbitraje: comprar Lecap + long Rofex vs short DL.
    - Breakeven DL < Rofex: DL priceando menos devaluación que futuros.
      Arbitraje: comprar DL + short Rofex.

    QUÉ EVALUAR:
    - Identificación de la divergencia.
    - Dirección correcta del arbitraje.
    - Mención de costos (basis, liquidez, margin).
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: estr-006
  category: estrategia
  difficulty: hard
  query: "quiero immunizar un pasivo a 12 meses con bonos CER"
  expected_tools:
    - name: obtener_curva_cer
    - name: calcular_duration_convexidad
  rubric: |
    PROCESO ESPERADO:
    1. Identificar el pasivo (duration objetivo = 12 meses).
    2. Elegir portfolio de Boncer cuyo duration ponderado = 12 meses.
    3. Preferir barbell (corto + largo) para mayor convexidad.

    CRITERIOS CONDICIONALES:
    - Curva empinada: barbell tiene roll-down combinado positivo.
    - Curva plana: bullet (un solo bono cerca de 12m) es suficiente.

    QUÉ EVALUAR:
    - Duration match explícito.
    - Elección bullet vs barbell justificada.
    - Mención de convexidad como valor agregado.
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"


# ═══════════════════════════════════════════════════════════════════════════
# CATEGORÍA 10 — MULTI-TURN (seguimiento analítico)
# Para estos tests, el eval runner debe resolver dinámicamente la respuesta
# del turno previo (ver backlog: "Manejo de placeholders en history").
# ═══════════════════════════════════════════════════════════════════════════

- id: mt-001
  category: multi_turn
  difficulty: hard
  history:
    - role: user
      content: "la forward entre los dos Bonares cómo viene"
    - role: assistant
      content: "<RUN_PREVIOUS_TURN_AND_CAPTURE/>"
  query: "y si comprime a 8, cuánto le queda de recorrido al bono largo"
  expected_tools:
    - name: obtener_curva_hd
    - name: calcular_duration_convexidad
  rubric: |
    PROCESO ESPERADO:
    1. Tomar la forward actual del turno previo.
    2. Calcular el precio implícito del bono largo con forward = 8%.
    3. Estimar ganancia de capital.
    4. Mencionar timing y catalizadores.

    QUÉ EVALUAR:
    - Uso correcto del contexto previo.
    - Cálculo numérico del upside.
    - No pedir datos ya provistos.
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: mt-002
  category: multi_turn
  difficulty: hard
  history:
    - role: user
      content: "dame los breakevens cortos"
    - role: assistant
      content: "<RUN_PREVIOUS_TURN_AND_CAPTURE/>"
  query: "si la inflación realizada es más alta, cuánto gana el CER en el par más corto"
  expected_tools:
    - name: obtener_inflacion_reciente
  rubric: |
    PROCESO ESPERADO:
    1. Tomar el breakeven mencionado previamente.
    2. Calcular diferencia inflación realizada - breakeven.
    3. Aplicar al horizonte del par.
    4. Cuantificar en bps.

    QUÉ EVALUAR:
    - No repetir datos del turno anterior.
    - Cálculo claro de la diferencia.
    - P&L en bps del par específico.
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"

- id: mt-003
  category: multi_turn
  difficulty: hard
  history:
    - role: user
      content: "armame un barbell HD"
    - role: assistant
      content: "<RUN_PREVIOUS_TURN_AND_CAPTURE/>"
  query: "cómo queda si el riesgo país sube en lugar de bajar"
  expected_tools:
    - name: calcular_duration_convexidad
  rubric: |
    PROCESO ESPERADO:
    1. Tomar la estructura del barbell del turno anterior.
    2. Aplicar ensanchamiento al bono largo y al corto.
    3. Calcular P&L combinado.

    QUÉ EVALUAR:
    - Uso del contexto previo.
    - Simetría con respuesta anterior (misma duration, mismos pesos).
    - Conclusión sobre resiliencia de la estructura.
  added: "2026-04-20"
  source: "mesa ACA Valores · golden set v1"


