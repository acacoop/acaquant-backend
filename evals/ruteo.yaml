# EVAL DEL RUTEO — a qué agentes tiene que ir cada pregunta.
#
# Cada fila es una pregunta REAL y los agentes que TIENEN que atenderla. Se corre
# con `python -m scripts.eval_ruteo`. Esto NO es un test: no dice si el código
# anda, dice si el ruteo DECIDE BIEN. Cuando no coincide, la que manda es esta
# lista — se corrigen las señales del agente, no la fila.
#
# Cómo llenar `agentes`:
#   - los que hacen falta para contestar BIEN, ni uno más ni uno menos.
#   - lista vacía = ningún agente (la contesta una regla, como «¿qué sabés hacer?»).
#   - si dudás entre uno o dos, poné los dos: que falte uno es el error caro.
#
# Agentes: cartera · cliente · operaciones · renta_fija · renta_variable ·
#          fondos · derivados · financiamiento · dolares

# ── preguntas de la mesa (las escribió el usuario, tal cual) ────────────────

- q: "Cual es mi cartera?"
  agentes: [cartera]
  nota: "sin cuenta: el ruteo acierta igual, el agente va a repreguntar cuál."

- q: "Cual es el portafolio de la 805?"
  agentes: [cartera]
  nota: "«portafolio» es sinónimo de cartera/tenencia."

- q: "Que bonos HD hay cotizando a mas de 5% de tasa?"
  agentes: [renta_fija]

- q: "Como viene la curva de YPF?"
  agentes: [renta_fija]
  nota: "YPF acá es EMISOR de ONs, no la acción. La curva es de renta fija."

- q: "A cuanto esta el dolar MEP?"
  agentes: [dolares]

- q: "Necesito que me des 3 alternativas a rotar el bono HD que menos me rinde mi de cartera."
  agentes: [cartera, renta_fija]
  nota: "el cruce: qué tengo (cartera) contra qué hay (renta_fija)."

- q: "Cuanto cobro en cupones de acaa fin de año?"
  agentes: [cartera]

- q: "En que titulo tengo mas plata y en cual tengo menos?"
  agentes: [cartera]

- q: "Cual es el operador de la 1230?"
  agentes: [cliente]

- q: "Que sabes hacer?"
  agentes: []
  nota: "la contesta una regla desde el registro: ni un token."

- q: "Cual es la lecap que rinde mas en TNA?"
  agentes: [renta_fija]

- q: "Cual es la duration promedio de la curva CER?"
  agentes: [renta_fija]

- q: "Cual es el vencimiento mas lejano de la curva de HD excluyendo bonos de YPF?"
  agentes: [renta_fija]

# ── sembradas (las puso Claude; corregir el `agentes` donde no coincida) ────

- q: "¿qué bono CER rinde más que los que tengo en la 805?"
  agentes: [cartera, renta_fija]

- q: "¿cuánto cobro de la 805?"
  agentes: [cartera]

- q: "quién es el titular de la 805"
  agentes: [cliente]

- q: "quién atiende la 805 y qué tenencia tiene"
  agentes: [cartera, cliente]

- q: "qué se operó hoy en AL30"
  agentes: [operaciones]

- q: "cuánto rinde la caución a 7 días"
  agentes: [financiamiento]

- q: "cómo cotiza YPF"
  agentes: [renta_variable]
  nota: "sin «curva» ni «ON», YPF es la acción."

- q: "qué es el AL30"
  agentes: [renta_fija]

- q: "qué fondo money market rinde más"
  agentes: [fondos]

- q: "qué opciones hay de GGAL"
  agentes: [derivados]

- q: "a cuánto está el dólar futuro de diciembre"
  agentes: [derivados, dolares]
  nota: "señal compartida a propósito: van los dos, es más barato que elegir mal."

- q: "necesito ayuda con la 805"
  agentes: [cartera, cliente, operaciones]
  nota: "borde: NO es meta. Sin señal de tema, los tres de cuenta la atienden."
