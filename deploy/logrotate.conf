# deploy/logrotate.conf — rotación de los logs de jobs/crons de AcaQuant.
#
# QUÉ SOLUCIONA: `deploy/run_job.sh` appendea a logs/<nombre>.log y NUNCA rota.
# jobs.market_quotes corre CADA MINUTO (~700 corridas/día, cada una escribiendo su
# START/OK) → el log crece sin techo. Un disco lleno en el Droplet tumba TODO a la
# vez (motores, API, jobs). Esto pone el techo.
#
# INSTALAR EN EL DROPLET — una sola línea (como root):
#
#   ln -sf /root/TradingAV/deploy/logrotate.conf /etc/logrotate.d/tradingav
#
# (Verificar sin tocar nada, opcional:  logrotate -d /etc/logrotate.d/tradingav )
#
# copytruncate es OBLIGATORIO acá: los procesos de los jobs tienen el fd del log
# ABIERTO en modo append. Sin copytruncate, logrotate renombra el archivo y el
# proceso sigue escribiendo al inode viejo (ya rotado) → el log "nuevo" queda vacío
# y el viejo crece invisible. copytruncate copia el contenido y trunca el archivo
# original in-place, así el fd abierto sigue siendo válido.

/root/TradingAV/logs/*.log {
    daily
    maxsize 50M
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
    su root root
}
